name: Windows MSVC build (Vina-GPU-2.1)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (!(Test-Path "$env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe")) {
            & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/buildtrees
            vcpkg/packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install deps (OpenCL + Boost components)
        shell: pwsh
        run: |
          $triplet = "x64-windows"
          $pkgs = @(
            "opencl",
            "boost-program-options",
            "boost-filesystem",
            "boost-system",
            "boost-serialization",
            "boost-random",
            "boost-timer",
            "boost-thread"
          ) | ForEach-Object { "$_:$triplet" } | Join-String " "
          & "$env:GITHUB_WORKSPACE/vcpkg/vcpkg.exe" install $pkgs

      - name: Create compatibility headers (unistd + convenience.hpp)
        shell: pwsh
        run: |
          $compat = Join-Path $env:GITHUB_WORKSPACE "compat"
          New-Item -ItemType Directory -Force -Path $compat | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $compat "boost/filesystem") | Out-Null

          # Minimal unistd.h for MSVC
          @"
          #pragma once
          #ifdef _MSC_VER
            #include <windows.h>
            #include <process.h>
            #include <io.h>
            #include <direct.h>
            #include <stdint.h>
            // micros->ms (round up at least 1 ms if nonzero)
            #ifndef usleep
              static inline void usleep(unsigned int usec) { Sleep((usec + 999) / 1000); }
            #endif
            #ifndef sleep
              static inline unsigned int sleep(unsigned int sec) { Sleep(sec * 1000); return 0; }
            #endif
            #ifndef getpid
              #define getpid _getpid
            #endif
            #ifndef access
              #define access _access
            #endif
            #ifndef F_OK
              #define F_OK 0
            #endif
            #ifndef R_OK
              #define R_OK 4
            #endif
          #else
            #include_next <unistd.h>
          #endif
          "@ | Set-Content -Encoding ASCII (Join-Path $compat "unistd.h")

                    # Shim for removed Boost header
                    @"
          #pragma once
          #include <boost/filesystem.hpp>
          "@ | Set-Content -Encoding ASCII (Join-Path $compat "boost/filesystem/convenience.hpp")

      - name: Configure (CMake + vcpkg toolchain)
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $src = Join-Path $ws "AutoDock-Vina-GPU-2.1"
          $bld = Join-Path $ws "build-av"
          $toolchain = Join-Path $ws "vcpkg/scripts/buildsystems/vcpkg.cmake"

          cmake -S "$src" -B "$bld" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_POLICY_DEFAULT_CMP0167=NEW `
            -DCL_TARGET_OPENCL_VERSION=300 `
            "-DCMAKE_CXX_FLAGS=/I`"$ws\compat`" /DCL_TARGET_OPENCL_VERSION=300 /DBOOST_TIMER_ENABLE_DEPRECATED=1 /D_CRT_SECURE_NO_WARNINGS"

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE/build-av" --config Release -m

      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: Vina-GPU-windows-binaries
          path: |
            build-av/Release/*.exe
            build-av/*.exe
          if-no-files-found: warn
