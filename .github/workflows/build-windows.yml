name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      BUILD_DIR: ${{ github.workspace }}\build-av
      SRC_DIR: ${{ github.workspace }}\AutoDock-Vina-GPU-2.1
      COMPAT_DIR: ${{ github.workspace }}\ci\compat
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Install Boost.Math (classic mode)
        shell: pwsh
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install boost-math --triplet x64-windows --classic
        
      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\installed
            ${{ env.VCPKG_ROOT }}\buildtrees
            ${{ env.VCPKG_ROOT }}\packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # Install OpenCL in classic mode OUTSIDE the manifest directory
      - name: Install OpenCL (classic mode)
        shell: pwsh
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install opencl --triplet x64-windows --classic

      # Now install the rest via your repo's manifest
      - name: vcpkg install (manifest mode)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          VCPKG_FEATURE_FLAGS: manifests
          VCPKG_DEFAULT_TRIPLET: x64-windows
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

      # --- Compatibility shims to build against modern Boost + Windows ---
      - name: Create compatibility headers (+ Windows option TU)
        shell: pwsh
        run: |
          # Folders
          New-Item -ItemType Directory -Force -Path "$env:COMPAT_DIR\boost\filesystem" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:COMPAT_DIR\boost\ptr_container" | Out-Null
      
          # 1) Legacy Boost convenience.hpp shim
          @'
          #pragma once
          #include <boost/version.hpp>
          #include <boost/filesystem.hpp>
          namespace boost { namespace filesystem {
              inline std::string basename(const path& p) { return p.stem().string(); }
              inline std::string extension(const path& p) { return p.extension().string(); }
              inline path change_extension(const path& p, const path& new_ext) { path q = p; q.replace_extension(new_ext); return q; }
              inline std::string leaf(const path& p) { return p.filename().string(); }
              inline std::string no_extension(const path& p) { return p.stem().string(); }
          }}
          '@ | Set-Content -Encoding ASCII "$env:COMPAT_DIR\boost\filesystem\convenience.hpp"
      
          # 2) Minimal Boost.PtrContainer shim
          #    Your code uses boost::ptr_vector<T>. Put it in ::boost, and also provide an alias in ::boost::ptr_container.
          @'
          #pragma once
          #include <vector>
          #include <memory>
          #include <cstddef>
          namespace boost {
            template <class T>
            class ptr_vector {
              using storage_t = std::vector<std::unique_ptr<T>>;
              storage_t data_;
            public:
              using value_type = T;
              using size_type = std::size_t;
              using iterator = typename storage_t::iterator;
              using const_iterator = typename storage_t::const_iterator;
      
              void push_back(T* p) { data_.emplace_back(p); }
              size_type size() const noexcept { return data_.size(); }
              bool empty() const noexcept { return data_.empty(); }
              void clear() noexcept { data_.clear(); }
              void reserve(size_type n) { data_.reserve(n); }
      
              T& operator[](size_type i)             { return *data_[i]; }
              const T& operator[](size_type i) const { return *data_[i]; }
              T& back()                              { return *data_.back(); }
              const T& back() const                  { return *data_.back(); }
      
              iterator begin() { return data_.begin(); }
              iterator end()   { return data_.end(); }
              const_iterator begin() const { return data_.begin(); }
              const_iterator end()   const { return data_.end(); }
            };
            namespace ptr_container {
              template<class T> using ptr_vector = ::boost::ptr_vector<T>;
            }
          }
          '@ | Set-Content -Encoding ASCII "$env:COMPAT_DIR\boost\ptr_container\ptr_vector.hpp"
      
          # 3) Windows-safe 'unistd.h' shim WITHOUT macros that clobber identifiers like boost::serialization::access
          @'
          #pragma once
          #ifdef _WIN32
          #  include <io.h>
          #  include <process.h>
          #  include <direct.h>
          #  include <windows.h>
             // Provide functions instead of macros to avoid breaking names like boost::serialization::access
             static inline int getpid(void) { return _getpid(); }
             static inline int access(const char* p, int m) { return _access(p, m); }
             static inline int unlink(const char* p) { return _unlink(p); }
             static inline int rmdir(const char* p) { return _rmdir(p); }
             static inline int chdir(const char* p) { return _chdir(p); }
             static inline void usleep(unsigned int usec) { Sleep((usec + 999) / 1000); }
             static inline void sleep(unsigned int sec) { Sleep(sec * 1000); }
          #endif
          '@ | Set-Content -Encoding ASCII "$env:COMPAT_DIR\unistd.h"
      
          # 4) Declare 'option' (no macros) and define it in a TU we add via file(GLOB)
          @'
          #pragma once
          #include <string>
          extern std::string option;
          '@ | Set-Content -Encoding ASCII "$env:COMPAT_DIR\windows_option_decl.h"
      
          $optSrc = @'
          #include <string>
          // Windows definition for the global OpenCL build options expected by wrapcl.cpp
          std::string option = "-cl-mad-enable -cl-fast-relaxed-math";
          '@
          $optPath = Join-Path "$env:SRC_DIR\OpenCL\src" "windows_option.cpp"
          Set-Content -Encoding ASCII $optPath $optSrc
      
      
      - name: Configure (CMake + MSVC)
        shell: pwsh
        run: |
          cmake -S "$env:SRC_DIR" -B "$env:BUILD_DIR" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_DEFAULT_CMP0167=NEW `
            -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_FLAGS="/I$env:COMPAT_DIR /DBOOST_TIMER_ENABLE_DEPRECATED /DWIN32_LEAN_AND_MEAN /DNOMINMAX /EHsc /permissive- /FI$env:SRC_DIR\OpenCL\inc\linux_fix.h /FI$env:COMPAT_DIR\windows_option_decl.h"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config Release -- /m

      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:BUILD_DIR\artifacts" | Out-Null
          Get-ChildItem -Recurse "$env:BUILD_DIR" -Filter *.exe | Copy-Item -Destination "$env:BUILD_DIR\artifacts" -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse "$env:BUILD_DIR" -Filter *.dll | Copy-Item -Destination "$env:BUILD_DIR\artifacts" -Force -ErrorAction SilentlyContinue

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vina-GPU-2.1_windows_x64_Release
          path: |
            ${{ env.BUILD_DIR }}\artifacts
            ${{ env.BUILD_DIR }}\AutoDock-Vina-GPU-2.1.dir\Release\*.pdb
