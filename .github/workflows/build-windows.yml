name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      BUILD_DIR: ${{ github.workspace }}\build-av
      SRC_DIR: ${{ github.workspace }}\AutoDock-Vina-GPU-2.1
      COMPAT_DIR: ${{ github.workspace }}\ci\compat
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_FEATURE_FLAGS: manifests

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Cache vcpkg artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\installed
            ${{ env.VCPKG_ROOT }}\buildtrees
            ${{ env.VCPKG_ROOT }}\packages
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/vcpkg.json', '**/vcpkg-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # Install OpenCL in classic mode OUTSIDE the manifest directory
      - name: Install OpenCL (classic mode)
        shell: pwsh
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install opencl --triplet x64-windows --classic

      # Now install the rest via your repo's manifest
      - name: vcpkg install (manifest mode)
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

      # --- Compatibility shims to build against modern Boost + Windows ---
      - name: Create compatibility headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:COMPAT_DIR\boost\filesystem" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:COMPAT_DIR" | Out-Null

          @'
          #pragma once
          #include <boost/version.hpp>
          #include <boost/filesystem.hpp>
          // Reintroduce legacy convenience API that some older code expects.
          namespace boost { namespace filesystem {
              inline std::string basename(const path& p) { return p.stem().string(); }
              inline std::string extension(const path& p) { return p.extension().string(); }
              inline path change_extension(const path& p, const path& new_ext) {
                  path q = p; q.replace_extension(new_ext); return q;
              }
              inline std::string leaf(const path& p) { return p.filename().string(); }
              inline std::string no_extension(const path& p) { return p.stem().string(); }
          }}
          '@ | Set-Content -Encoding ASCII "$env:COMPAT_DIR\boost\filesystem\convenience.hpp"

          @'
          #pragma once
          #ifdef _WIN32
          #  include <io.h>
          #  include <process.h>
          #  include <direct.h>
          #  include <windows.h>
          #  define getpid _getpid
          #  define access _access
          #  define unlink _unlink
          #  define rmdir _rmdir
          #  define chdir _chdir
          static inline void usleep(unsigned int usec) { Sleep((usec + 999) / 1000); }
          static inline void sleep(unsigned int sec) { Sleep(sec * 1000); }
          #endif
          '@ | Set-Content -Encoding ASCII "$env:COMPAT_DIR\unistd.h"

      - name: Configure (CMake + MSVC)
        shell: pwsh
        run: |
          cmake -S "$env:SRC_DIR" -B "$env:BUILD_DIR" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="/I$env:COMPAT_DIR /DBOOST_TIMER_ENABLE_DEPRECATED /DWIN32_LEAN_AND_MEAN /DNOMINMAX"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config Release -- /m

      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:BUILD_DIR\artifacts" | Out-Null
          Get-ChildItem -Recurse "$env:BUILD_DIR" -Filter *.exe | Copy-Item -Destination "$env:BUILD_DIR\artifacts" -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse "$env:BUILD_DIR" -Filter *.dll | Copy-Item -Destination "$env:BUILD_DIR\artifacts" -Force -ErrorAction SilentlyContinue

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vina-GPU-2.1_windows_x64_Release
          path: |
            ${{ env.BUILD_DIR }}\artifacts
            ${{ env.BUILD_DIR }}\AutoDock-Vina-GPU-2.1.dir\Release\*.pdb
